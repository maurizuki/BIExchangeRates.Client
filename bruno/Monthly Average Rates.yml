info:
  name: Monthly Average Rates
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUri}}/monthlyAverageRates?month=12&year=2020&currencyIsoCode=EUR&lang=en"
  params:
    - name: month
      value: "12"
      type: query
    - name: year
      value: "2020"
      type: query
    - name: currencyIsoCode
      value: EUR
      type: query
    - name: lang
      value: en
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
