info:
  name: Annual Average Rates
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUri}}/annualAverageRates?year=2020&currencyIsoCode=EUR&lang=en"
  params:
    - name: year
      value: "2020"
      type: query
    - name: currencyIsoCode
      value: EUR
      type: query
    - name: lang
      value: en
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
