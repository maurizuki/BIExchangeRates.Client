info:
  name: Daily Rates
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUri}}/dailyRates?referenceDate=2020-12-31&currencyIsoCode=EUR&lang=en"
  params:
    - name: referenceDate
      value: 2020-12-31
      type: query
    - name: currencyIsoCode
      value: EUR
      type: query
    - name: lang
      value: en
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
