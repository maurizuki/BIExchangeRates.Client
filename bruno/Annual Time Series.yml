info:
  name: Annual Time Series
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUri}}/annualTimeSeries?startYear=2010&endYear=2020&baseCurrencyIsoCode=USD&currencyIsoCode=EUR&lang=en"
  params:
    - name: startYear
      value: "2010"
      type: query
    - name: endYear
      value: "2020"
      type: query
    - name: baseCurrencyIsoCode
      value: USD
      type: query
    - name: currencyIsoCode
      value: EUR
      type: query
    - name: lang
      value: en
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
