info:
  name: Monthly Time Series
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUri}}/monthlyTimeSeries?startMonth=1&startYear=2020&endMonth=12&endYear=2020&baseCurrencyIsoCode=USD&currencyIsoCode=EUR&lang=en"
  params:
    - name: startMonth
      value: "1"
      type: query
    - name: startYear
      value: "2020"
      type: query
    - name: endMonth
      value: "12"
      type: query
    - name: endYear
      value: "2020"
      type: query
    - name: baseCurrencyIsoCode
      value: USD
      type: query
    - name: currencyIsoCode
      value: EUR
      type: query
    - name: lang
      value: en
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
